name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.0.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project PostBank.xcodeproj \
            -scheme PostBank \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/PostBank.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | xcpretty || true

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/PostBank.xcarchive/Products/Applications/PostBank.app build/Payload/
          cd build
          zip -qry PostBank.ipa Payload
          ls -lh PostBank.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PostBank-unsigned-ipa
          path: build/PostBank.ipa
          retention-days: 30